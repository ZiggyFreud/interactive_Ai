<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent Clearance Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: security-console training lab — sticky module rail on the left, one working stage on the right; collapses to a top strip on phones. Single dark look by request. */
:root{
  --ink:#0d1219;          /* page ground: blue-slate night */
  --panel:#151c26;        /* raised surfaces */
  --panel-2:#1c2532;      /* inputs, wells */
  --line:#2a3546;         /* hairlines */
  --fg:#e6ebf2;           /* primary text */
  --muted:#93a0b4;        /* secondary text */
  --amber:#f2b04a;        /* accent: clearance badge */
  --amber-ink:#2a1d05;
  --allow:#56c9b4;        /* semantic: allowed */
  --ask:#8fa8ff;          /* semantic: needs human approval */
  --deny:#f07a6a;         /* semantic: denied */
  --allow-bg:rgba(86,201,180,.12);
  --ask-bg:rgba(143,168,255,.13);
  --deny-bg:rgba(240,122,106,.12);
  --amber-bg:rgba(242,176,74,.12);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.88em}
abbr{text-decoration:none;border-bottom:1px dotted var(--muted);cursor:help}

.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 60px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding-block:6px 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:13px;flex:none}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.top-stats{margin-left:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:500}
.stat span{font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.meter{width:180px;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--amber);width:0;transition:width .5s ease}
.sync{font-size:.78rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.on{color:var(--allow);border-color:rgba(86,201,180,.4);background:var(--allow-bg)}

.layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(16px + env(safe-area-inset-top, 0px));display:flex;flex-direction:column;gap:6px}
.rail-label{font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:0 10px 6px}
.mod-btn{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:var(--r);border:1px solid transparent;background:none;cursor:pointer}
.mod-btn:hover{background:var(--panel)}
.mod-btn[aria-current="true"]{background:var(--panel);border-color:var(--line)}
.mod-btn .n{font-family:var(--mono);font-size:.78rem;color:var(--muted);width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center}
.mod-btn.done .n{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.mod-btn .t{font-weight:500;font-size:.93rem;line-height:1.25}
.mod-btn .t small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.mod-btn .pct{font-family:var(--mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rail .teacher-btn{margin-top:12px;border-top:1px solid var(--line);padding-top:14px}

.stage{min-width:0;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--mono);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.stage-head{display:flex;flex-direction:column;gap:10px;max-width:70ch}
.stage-head h2{font-size:clamp(1.7rem,3.2vw,2.35rem);font-weight:800;letter-spacing:-.015em}
.lede{color:var(--muted);font-size:1.02rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:1.15rem;font-weight:700}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile h4{margin:0;font-size:.98rem;font-family:var(--body);font-weight:600}
.tile p{color:var(--muted);font-size:.9rem}
.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.check-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.72rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--allow);border-color:rgba(86,201,180,.45);background:var(--allow-bg)}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
ul.clean li::marker{color:var(--amber)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:500;font-size:.92rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* feedback */
.fb{border-radius:var(--r);padding:12px 14px;font-size:.92rem;border:1px solid}
.fb.good{background:var(--allow-bg);border-color:rgba(86,201,180,.4)}
.fb.bad{background:var(--deny-bg);border-color:rgba(240,122,106,.4)}
.fb.info{background:var(--amber-bg);border-color:rgba(242,176,74,.35)}
.fb b{font-weight:600}

/* MCQ */
.mcq{display:flex;flex-direction:column;gap:10px}
.mcq .q{font-weight:500}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;width:100%}
.opt:hover{border-color:var(--muted)}
.opt .k{font-family:var(--mono);font-size:.78rem;color:var(--muted);flex:none;width:18px;padding-top:2px}
.opt.right{border-color:var(--allow);background:var(--allow-bg)}
.opt.wrong{border-color:var(--deny);background:var(--deny-bg)}

/* ID card builder */
.idlab{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.attr{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.attr input{margin-top:4px;accent-color:var(--amber);width:16px;height:16px;flex:none}
.attr span{font-size:.92rem}
.attr span small{display:block;color:var(--muted);font-family:var(--mono);font-size:.76rem}
.attr.right{border-color:var(--allow)}
.attr.wrong{border-color:var(--deny)}
.attr-list{display:flex;flex-direction:column;gap:8px}
.badge-card{border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,#1f2a39,#141b25 70%);padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-width:0}
.badge-card::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(242,176,74,.08)}
.badge-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge-top b{font-family:var(--display);font-size:1.05rem}
.badge-photo{width:56px;height:56px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);color:var(--amber);font-size:.8rem}
.badge-fields{display:flex;flex-direction:column;gap:7px;font-family:var(--mono);font-size:.8rem;min-width:0}
.badge-fields div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:5px;min-width:0}
.badge-fields div span:first-child{color:var(--muted);flex:none}
.badge-fields div span:last-child{text-align:right;overflow-wrap:anywhere}
.badge-fields .risky span:last-child{color:var(--deny)}
.badge-empty{color:var(--muted);font-size:.85rem}

/* access lab */
.tooltray{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tool{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;min-width:0}
.tool b{font-size:.92rem;font-weight:600}
.tool small{color:var(--muted);font-size:.78rem;line-height:1.4}
.tool[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-bg)}
.tool.right{border-color:var(--allow)!important;background:var(--allow-bg)!important}
.tool.wrong{border-color:var(--deny)!important;background:var(--deny-bg)!important}
.tool.missed{border-style:dashed!important;border-color:var(--allow)!important}
.scenario{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px}
.scenario dt{color:var(--muted);font-family:var(--mono);font-size:.78rem;padding-top:2px}
.scenario dd{margin:0}

/* permission matrix */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.9rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--panel-2)}
tr:last-child td{border-bottom:none}
td code{color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:none;padding:6px 10px;font-size:.8rem;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"][data-v="allow"]{background:var(--allow-bg);color:var(--allow)}
.seg button[aria-pressed="true"][data-v="ask"]{background:var(--ask-bg);color:var(--ask)}
.seg button[aria-pressed="true"][data-v="deny"]{background:var(--deny-bg);color:var(--deny)}
.verdict{font-size:.8rem;color:var(--muted);max-width:34ch}
.verdict.good{color:var(--allow)}
.verdict.bad{color:var(--deny)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.legend .a::before{background:var(--allow)}.legend .s::before{background:var(--ask)}.legend .d::before{background:var(--deny)}

/* diagram */
.diagram{overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:640px;height:auto}
.gate-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gate{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px}
.gate .tag{color:var(--amber)}
.gate p{font-size:.88rem;color:var(--muted)}

/* proxy sim */
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.req pre{margin:0;font-family:var(--mono);font-size:.8rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.req pre .c{color:var(--muted)}
.req .acts{display:flex;flex-direction:column;gap:8px}
.req .acts button{min-width:96px}
.btn.allow{color:var(--allow);border-color:rgba(86,201,180,.45)}
.btn.deny{color:var(--deny);border-color:rgba(240,122,106,.45)}
.req .out{grid-column:1/-1}
.req.answered .acts{display:none}
.counter{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* roles */
.roles{display:flex;flex-direction:column;gap:10px}
.role-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,260px);gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.role-row select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);}
.role-row.right{border-color:var(--allow)}.role-row.wrong{border-color:var(--deny)}

/* certificate */
.cert{border:1px solid rgba(242,176,74,.5);background:radial-gradient(120% 140% at 0% 0%,rgba(242,176,74,.16),transparent 55%),var(--panel);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px}
.cert h3{font-size:1.6rem}
.cert .code{font-family:var(--mono);font-size:1.05rem;letter-spacing:.12em;color:var(--amber)}

/* roster */
.roster td .bar{width:110px;height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;border:1px solid var(--line)}
.roster td .bar i{display:block;height:100%;background:var(--amber)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}
.dots i.d{background:var(--amber);border-color:var(--amber)}
.dots i.p{background:rgba(242,176,74,.35);border-color:rgba(242,176,74,.5)}
.empty{color:var(--muted);font-size:.92rem;padding:18px;text-align:center}
.nav-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px}
  .rail-label{display:none}
  .mod-btn{grid-template-columns:30px auto;min-width:max-content;border-color:var(--line)}
  .mod-btn .pct{display:none}
  .mod-btn .t small{display:none}
  .rail .teacher-btn{margin-top:0;border-top:none;padding-top:10px}
  .idlab,.grid2{grid-template-columns:minmax(0,1fr)}
  .grid3,.gate-steps{grid-template-columns:minmax(0,1fr)}
  .meter{width:120px}
}
@media (max-width:520px){
  .req{grid-template-columns:minmax(0,1fr)}
  .req .acts{flex-direction:row}
  .role-row{grid-template-columns:minmax(0,1fr)}
  .top-stats{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body style="margin:0">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">ID</div>
      <div>
        <small>Agentic AI Security</small>
        <h1>Agent Clearance Lab</h1>
      </div>
    </div>
    <div class="top-stats">
      <div class="stat"><b id="pctTxt">0%</b><span>Complete</span></div>
      <div class="meter" aria-hidden="true"><i id="pctBar"></i></div>
      <div class="stat"><b id="xpTxt">0</b><span>Clearance points</span></div>
      <span class="sync" id="syncChip">Saved on this device</span>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Modules"></nav>
    <main class="stage" id="stage"></main>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------------- Course definition ---------------- */
const MODULES = [
  {id:"brief",  n:"00", title:"Mission Brief", sub:"Workforce skills & objectives", checks:["brief-ack","brief-roles"]},
  {id:"agentid",n:"01", title:"Agent ID",      sub:"Who is this agent?",          checks:["id-card","id-q1","id-q2"]},
  {id:"access", n:"02", title:"Agent Access",  sub:"Which tools can it touch?",  checks:["access-lab","access-q1"]},
  {id:"perms",  n:"03", title:"Agent Permissions", sub:"What can it do with a tool?", checks:["perms-lab","perms-q1"]},
  {id:"proxy",  n:"04", title:"Proxy & Orchestration", sub:"Enforce it at runtime", checks:["proxy-sim","proxy-q1"]},
  {id:"final",  n:"05", title:"Clearance Exam", sub:"Earn your certificate",       checks:["final-quiz"]}
];
const ALL_CHECKS = MODULES.flatMap(m=>m.checks);
const POINTS = {"brief-ack":20,"brief-roles":40,"id-card":80,"id-q1":30,"id-q2":30,"access-lab":80,"access-q1":30,"perms-lab":100,"perms-q1":30,"proxy-sim":120,"proxy-q1":30,"final-quiz":160};
const MAX_XP = Object.values(POINTS).reduce((a,b)=>a+b,0);

/* ---------------- State & persistence ---------------- */
const LS_KEY = "agent-clearance-lab-v1";
let state = {checks:{}, current:"brief", started:Date.now(), updated:Date.now()};
try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const s = JSON.parse(raw); if(s && s.checks) state = Object.assign(state, s); } }catch(e){}

let db=null, user=null, myId=null, canSync=false, isTeacher=false, writeTimer=null, rosterUnsub=null, rosterDocs=[];

function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function summary(){
  const done = ALL_CHECKS.filter(c=>state.checks[c]);
  const xp = done.reduce((a,c)=>a+(state.checks[c].pts||0),0);
  const perModule = {};
  MODULES.forEach(m=>{ perModule[m.id] = m.checks.filter(c=>state.checks[c]).length / m.checks.length; });
  return {pct: Math.round(done.length/ALL_CHECKS.length*100), xp, perModule, doneCount:done.length};
}
function scheduleSync(){
  if(!canSync) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(async ()=>{
    const s = summary();
    try{
      await db.doc("progress/"+myId).set({checks:state.checks, pct:s.pct, xp:s.xp, perModule:s.perModule, updated:Date.now(), started:state.started});
      setSync(true);
    }catch(e){
      if(e && e.code==="invalid_argument"){ canSync=false; setSync(false,"Saved on this device · ask your instructor for Contributor access to sync"); }
    }
  }, 900);
}
function complete(id, pts){
  if(state.checks[id]) return false;
  state.checks[id] = {pts: Math.max(0, Math.round(pts)), at: Date.now()};
  state.updated = Date.now();
  saveLocal(); scheduleSync(); renderChrome();
  return true;
}
function setSync(on, text){
  const el = document.getElementById("syncChip");
  el.classList.toggle("on", !!on);
  el.textContent = text || (on ? "Synced to class roster" : "Saved on this device");
}

/* ---------------- Helpers ---------------- */
const $ = (s, r=document)=>r.querySelector(s);
const h = (html)=>{ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content; };
function doneChip(id){ return `<span class="chip ${state.checks[id]?"ok":""}" data-chip="${id}">${state.checks[id]?"✓ Complete · +"+state.checks[id].pts+" pts":"Checkpoint · "+POINTS[id]+" pts"}</span>`; }
function refreshChip(id){ const el=document.querySelector(`[data-chip="${id}"]`); if(el){ el.outerHTML = doneChip(id); } }

/* Multiple-choice question. First-try correct = full points, otherwise half. */
function mcq(container, checkId, q){
  const letters = "ABCD";
  const box = h(`<div class="mcq"><p class="q">${q.q}</p>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${letters[i]}</span><span>${o}</span></button>`).join("")}<div class="fbslot"></div></div>`);
  container.appendChild(box);
  const root = container.lastElementChild;
  let tries = 0;
  if(state.checks[checkId]){
    root.querySelector(`.opt[data-i="${q.a}"]`).classList.add("right");
    root.querySelector(".fbslot").innerHTML = `<div class="fb good"><b>Correct.</b> ${q.why}</div>`;
  }
  root.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(state.checks[checkId]) return;
    tries++;
    const i = +b.dataset.i;
    if(i===q.a){
      b.classList.add("right");
      root.querySelectorAll(".opt.wrong").forEach(x=>x.classList.remove("wrong"));

function renderRail(){

    return `<button class="mod-btn ${p===1?"done":""}" data-m="${m.id}" aria-current="${state.current===m.id}">

function go(id){
  state.current = id; saveLocal();
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  renderChrome(); renderStage();
  window.scrollTo({top:0, behavior:"smooth"});

function footNav(id){
  const i = MODULES.findIndex(m=>m.id===id);

  return `<div class="nav-foot">${prev?`<button class="btn" data-go="${prev.id}">← ${prev.title}</button>`:"<span></span>"}${next?`<button class="btn primary" data-go="${next.id}">Next: ${next.title} →</button>`:""}</div>`;

function verifyCode(){
  const src = ALL_CHECKS.map(c=>c+":"+(state.checks[c]?state.checks[c].pts+"@"+state.checks[c].at:"-")).join("|") + "|" + state.started;
  let h1=0x811c9dc5; for(let i=0;i<src.length;i++){ h1^=src.charCodeAt(i); h1=Math.imul(h1,16777619)>>>0; }
  const s=h1.toString(36).toUpperCase().padStart(7,"0");
  return "AGC-"+s.slice(0,4)+"-"+s.slice(4,8);
}

            const remote = snap.data()||{};
            const merged = Object.assign({}, remote.checks||{}, state.checks);
            state.checks = merged; if(remote.started && remote.started<state.started) state.started=remote.started;
            saveLocal();
          }
          setSync(true); scheduleSync();
        }catch(e){ canSync=false; }
      } else setSync(false,"Saved on this device · ask your instructor for Contributor access to sync");
    }
    if(isTeacher){
      setSync(true,"Instructor · roster live");
      rosterUnsub = db.collection("progress").onSnapshot(qs=>{
        rosterDocs = qs.docs.map(d=>({id:d.id, data:d.data()||{}}));
        if(state.current==="roster") paintRoster();
      }, ()=>{});
    }
    renderChrome(); renderStage();
  }catch(e){}
})();
})();
</script>
